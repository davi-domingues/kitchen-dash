# Gates determinísticos do PR (AGENTS.md §3). Os nomes dos jobs são checks obrigatórios no ruleset da main:
# mudar um nome exige atualizar o ruleset no mesmo PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convencoes:
    name: Convenções
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nome da branch e título do PR
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          tipos='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          falhou=0
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "PR do Dependabot: convenções liberadas."
            exit 0
          fi
          if ! [[ "$BRANCH" =~ ^($tipos)/(kd-[0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$BRANCH' fora do padrão <tipo>/kd-XX-descricao-curta"
            falhou=1
          fi
          if ! [[ "$TITLE" =~ ^($tipos)(\([a-z0-9-]+\))?!?:\ [^\ ].*[^.]$ ]] || [ ${#TITLE} -gt 72 ]; then
            echo "::error::Título do PR fora do padrão 'tipo(escopo): descrição' (até 72 caracteres, sem ponto final)"
            falhou=1
          fi
          exit $falhou
      - name: Fora de PR não há o que checar
        if: github.event_name != 'pull_request'
        run: echo "Convenções só se aplicam a PRs."

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  qualidade:
    name: Qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar app
        id: app
        run: |
          if [ -f package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"
          else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "::notice::Sem package.json ainda (KD-02): gates de código pulados."; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.app.outputs.existe == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.app.outputs.existe == 'true'
        run: npm ci
      - if: steps.app.outputs.existe == 'true'
        run: npm run format:check
      - if: steps.app.outputs.existe == 'true'
        run: npm run lint
      - if: steps.app.outputs.existe == 'true'
        run: npm test
      - if: steps.app.outputs.existe == 'true'
        run: npm run build
      - if: steps.app.outputs.existe == 'true'
        run: npm run check-size --if-present
      - if: steps.app.outputs.existe == 'true'
        run: npm audit --audit-level=high --omit=dev
